{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Online Tutor{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  {% block extra_css %}{% endblock %}

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <!-- Minimal top bar with logo and back-to-home link -->
  <div style="position:fixed;top:0;left:0;right:0;z-index:100;
              padding:.75rem 2rem;
              background:rgba(255,255,255,.05);
              backdrop-filter:blur(10px);
              border-bottom:1px solid rgba(255,255,255,.1);
              display:flex;justify-content:space-between;align-items:center;">

    <a href="/" style="font-size:1.4rem;font-weight:800;text-decoration:none;
                       background:linear-gradient(135deg,#667eea,#f093fb);
                       -webkit-background-clip:text;-webkit-text-fill-color:transparent;">
      <i class="fas fa-graduation-cap me-2"></i>Lihiket Tutor
    </a>

    <div class="d-flex gap-3 align-items-center">
      <a href="/accounts/login/"
         style="color:rgba(255,255,255,.8);text-decoration:none;font-size:.9rem;font-weight:500;">
        Login
      </a>
      <a href="/accounts/register/"
         style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
                padding:.4rem 1.2rem;border-radius:50px;text-decoration:none;
                font-size:.9rem;font-weight:600;">
        Sign Up
      </a>
    </div>
  </div>

  <!-- Page content -->
  <div style="padding-top:70px;min-height:100vh;
              display:flex;align-items:center;justify-content:center;">

    {% if messages %}
    <div style="position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:200;min-width:340px;">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible shadow" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
