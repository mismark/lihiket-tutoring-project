{% extends "base.html" %}

{% block title %}Create Chat Room{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Create Chat Room</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.name.id_for_label }}">Room Name</label>
            {{ form.name }}
        </div>
        <div class="form-group">
            <label for="{{ form.room_type.id_for_label }}">Room Type</label>
            {{ form.room_type }}
        </div>
        <div class="form-group">
            <label for="{{ form.participants.id_for_label }}">Participants</label>
            {{ form.participants }}
        </div>
        <button type="submit" class="btn btn-primary">Create Chat Room</button>
    </form>
</div>
{% endblock %}
